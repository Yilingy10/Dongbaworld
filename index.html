<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dongba World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Silkscreen&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  /* One visual world: a pop-up book on a sage pixel-framed desk. Single theme by choice. */
  --sage:#8fa585; --sage-deep:#4f6249; --paper:#f5eedc; --paper-2:#e9dfc6; --ink:#1d1b17; --ember:#d8642e;
  --display:"Silkscreen", ui-monospace, monospace;
  --body:"Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}html{background:linear-gradient(#8fc3d6 0%,#b9dade 30%,#e3ead6 56%,#efead4 100%) fixed #e3ead6;overflow:hidden;overscroll-behavior:none}
body[data-lang="en"]{--body:"Inter", "Helvetica Neue", Arial, system-ui, sans-serif}
body[data-lang="zh"] .px,body[data-lang="zh"] #card dt,body[data-lang="zh"] #card h4,body[data-lang="zh"] #notes h3,body[data-lang="zh"] #stars h3{font-family:var(--body);text-transform:none;letter-spacing:.02em}
body{background:#cfd8cf;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#sky{position:fixed;inset:0;background:radial-gradient(50% 30% at 66% 62%,rgba(246,214,150,.75),rgba(246,214,150,0) 70%),linear-gradient(#8fc3d6 0%,#b9dade 30%,#e3ead6 56%,#efead4 100%)}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.frame{background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--sage-deep);border-radius:2px}
.px{font-family:var(--display);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.muted{color:var(--sage-deep)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.note-item:focus-visible{outline:3px solid var(--ember);outline-offset:2px}

#title{position:fixed;left:18px;top:18px;pointer-events:none}
#title h1{margin:0;font-family:var(--display);font-size:24px;font-weight:400;letter-spacing:.04em;color:var(--ink);text-shadow:0 0 6px rgba(255,250,235,.9),0 0 2px rgba(255,250,235,1)}
#title h1 span{font-family:var(--display);font-size:13px;font-weight:400;margin-left:8px;letter-spacing:.02em}

#topbtns{position:fixed;right:16px;top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 380px)}
#topbtns button{padding:8px 12px;background:var(--sage);color:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
#topbtns button.hot{background:var(--ember)}
#topbtns button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

#left{position:fixed;left:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;width:min(320px,calc(100vw - 32px))}
#log{padding:8px 10px;font-size:13px;line-height:1.45;color:var(--ink);background:rgba(246,239,222,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:6px}
#log .row{display:flex;align-items:center;gap:8px;padding:3px 0;border-top:1px dashed rgba(29,27,23,.15)}
#log .row:first-of-type{border-top:0}
#log img{width:30px;height:30px;object-fit:contain;flex:none}
#log .empty{color:#6c675b}
#controls{padding:0 2px;font-size:12px;line-height:1.8;white-space:nowrap;opacity:.9;color:var(--ink);text-shadow:0 0 5px rgba(255,250,235,.95),0 0 2px #fff}
#controls b{font-family:var(--display);font-weight:400;font-size:10px;background:rgba(29,27,23,.82);color:var(--paper);padding:0 4px;margin-right:4px;text-shadow:none}

#pose{position:fixed;right:16px;bottom:16px;padding:8px 12px 8px 8px;display:flex;align-items:center;gap:10px;font-size:13px;max-width:calc(100vw - 32px)}
#pose img{width:56px;height:56px;object-fit:contain;background:var(--paper-2);border:2px solid var(--ink)}
#pose .zh{font-size:20px;font-weight:900}
#pose .id{font-family:var(--display);font-size:10px;color:var(--sage-deep)}
#swatches{display:flex;gap:5px;margin-top:4px}
#held{display:flex;align-items:center;gap:4px;font-size:12.5px;margin-top:3px}#held:empty{display:none}#held img{width:24px;height:24px;border:0;background:none}
#swatches button{width:18px;height:18px;border:2px solid var(--ink);padding:0}
#swatches button[aria-pressed="true"]{outline:2px solid var(--ember);outline-offset:1px}

#prompt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:8px 14px;font-size:15px;white-space:nowrap;display:none}
#prompt b{font-family:var(--display);font-weight:400;background:var(--ember);color:var(--paper);padding:1px 6px;margin-right:6px;border:2px solid var(--ink)}
#banner{position:fixed;left:50%;top:70px;transform:translateX(-50%);display:none;align-items:center;gap:10px;font-size:16px;color:var(--ink);text-shadow:0 0 6px rgba(255,250,235,.95),0 0 2px #fff;white-space:nowrap}
#banner img{width:36px;height:36px;object-fit:contain}
#banner .bar{width:110px;height:8px;border:2px solid var(--ink);background:var(--paper-2)}
#banner .bar i{display:block;height:100%;background:var(--ember)}

#tip{position:fixed;pointer-events:none;padding:3px 8px;font-size:14px;display:none;background:var(--ink);color:var(--paper);border:2px solid var(--paper)}

#card{position:fixed;right:16px;top:74px;width:min(340px,calc(100vw - 32px));max-height:calc(100% - 190px);overflow:auto;padding:14px 16px;display:none}
#card .close{position:absolute;right:8px;top:8px;border:2px solid var(--ink);background:var(--paper-2);width:28px;height:28px;line-height:20px;font-family:var(--display)}
#card .glyph{display:flex;justify-content:center;background:var(--paper-2);border:2px dashed var(--sage-deep);padding:10px;margin:6px 0 10px}
#card .glyph img{max-width:100%;max-height:140px}
#card .zh{font-size:28px;font-weight:900;line-height:1.2;text-wrap:balance}
#card .en{font-size:16px;margin:2px 0 10px;font-style:italic}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:13px}
#card dt{font-family:var(--display);font-size:10px;color:var(--sage-deep);padding-top:3px}
#card dd{margin:0}
#card .chip{display:inline-block;padding:1px 7px;border:2px solid var(--ink);font-size:12px}
#card .chip.review{background:#f3d9a4}
#card .chip.ok{background:#bcd4b1}
#card .note{margin-top:10px;font-size:12.5px;line-height:1.6;color:#4a463c;border-top:2px solid var(--paper-2);padding-top:8px}
#card .parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#card .parts button,#card .acts button{display:flex;align-items:center;gap:4px;padding:3px 6px;border:2px solid var(--ink);background:var(--paper-2);font-size:13px}
#card .parts img,#card .acts img{width:28px;height:28px;object-fit:contain}
#card .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
#card .doing{display:flex;gap:10px;align-items:center;background:var(--paper-2);padding:6px 8px;margin:8px 0;border:2px solid var(--ink)}
#card .doing img{width:46px;height:46px;object-fit:contain;background:var(--paper)}
#card .needs{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:12px;align-items:center;margin:8px 0}
#card .needs i{display:block;height:7px;border:1px solid var(--ink);background:var(--paper-2)}
#card .needs i b{display:block;height:100%;background:var(--sage-deep)}
#card h4{margin:12px 0 4px;font-family:var(--display);font-weight:400;font-size:10px;color:var(--sage-deep);text-transform:uppercase}

#notes{position:fixed;right:16px;top:74px;bottom:110px;width:min(360px,calc(100vw - 32px));overflow:auto;padding:14px 16px;display:none}
#notes h2{margin:0 0 4px;font-size:18px}
#notes h3{margin:14px 0 6px;font-family:var(--display);font-weight:400;font-size:11px;color:var(--sage-deep);text-transform:uppercase;display:flex;justify-content:space-between}
#notes .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.note-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border:2px solid var(--paper-2);background:#fbf7ec;font-size:12px;position:relative;min-width:0}
.note-item img{width:44px;height:44px;object-fit:contain}
.note-item span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-item.seen{border-color:var(--sage-deep)}
.note-item.seen::after{content:"✓";position:absolute;right:3px;top:0;color:var(--sage-deep);font-weight:900}
#notes .gap{font-size:13px;line-height:1.55;padding:6px 8px;border-left:4px solid var(--ember);background:#fbf1e6;margin-bottom:6px}
#notes .gap b{display:block}
#notes p{font-size:13px;line-height:1.6;margin:6px 0}

#dress{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,calc(100vw - 32px));max-height:calc(100% - 40px);overflow:auto;padding:16px 18px;display:none;flex-direction:column;gap:8px;z-index:12}
.modal .close{position:absolute;right:10px;top:10px;border:2px solid var(--ink);background:var(--paper-2);width:30px;height:30px;font-family:var(--display);z-index:2}
#dress .zh{font-size:24px;font-weight:900}#dress p{font-size:13px;line-height:1.6;margin:4px 0;max-width:80ch}
#dress .dbody{display:flex;gap:16px;flex-wrap:wrap}#dress .dprev{display:flex;flex-direction:column;gap:8px;align-items:center}
#dress canvas{width:min(330px,80vw);height:auto;border:3px solid var(--ink);background:#efe6cf}
#dress .dside{flex:1;min-width:280px}
#dress .tabs{display:flex;gap:6px;flex-wrap:wrap}#dress .tabs button,.drow button{padding:6px 10px;border:2px solid var(--ink);background:var(--paper-2);font-size:13px}
#dress .tabs button[aria-pressed="true"]{background:var(--sage);color:var(--paper)}
#dress .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:8px}
#dress .cgrid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:2px solid var(--paper-2);background:#fbf7ec;font-size:12px}
#dress .cgrid img.rot90{transform:rotate(90deg)}
#dress .cgrid img.halfL{clip-path:inset(0 50% 0 0);transform:translateX(25%) scale(1.5)}
#dress .cgrid button.on{border-color:var(--ember);background:#fff1df}#dress .cgrid img{width:54px;height:46px;object-fit:contain}
#dress .ccols{display:flex;gap:6px;margin-top:4px}#dress .ccols button{width:24px;height:24px;border:2px solid var(--ink)}#dress .ccols button[aria-pressed="true"]{outline:3px solid var(--ember);outline-offset:1px}
#dress .dinfo{margin-top:8px;font-size:13px;line-height:1.6;background:var(--paper-2);padding:6px 8px;border:2px dashed var(--sage-deep)}
.drow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hotbtn{background:var(--ember)!important;color:var(--paper)}
#dress .album{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}#dress .album button{padding:0;border:2px solid var(--ink);background:none}#dress .album img{width:60px;height:75px;object-fit:cover;display:block}
#photoView{display:none;position:fixed;inset:0;background:rgba(20,18,14,.6);align-items:center;justify-content:center;z-index:3}
#photoView .pv{position:relative;background:#f4ead2;border:0;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 30px);box-shadow:0 12px 40px rgba(20,15,5,.35)}
#photoView .pv::before{content:"";position:absolute;inset:6px;border:2.2px solid rgba(110,80,45,.7);border-radius:14px 6px 18px 8px/8px 16px 6px 14px;filter:url(#rough);pointer-events:none}
#photoView .pv .drow{flex:none;justify-content:center}
#photoView img{min-height:0;flex:1 1 auto;object-fit:contain;max-height:calc(100vh - 260px);max-width:80vw;border:2px solid rgba(70,50,30,.8);border-radius:10px 4px 12px 5px}
#war{position:fixed;inset:12px;display:none;flex-direction:column;gap:6px;padding:14px 18px;z-index:12;overflow:auto;background:var(--paper);border-radius:10px;box-shadow:0 14px 50px rgba(40,30,15,.28)}
#war>.close{position:absolute;right:14px;top:12px}
#war .whead .zh{font-size:24px;font-weight:900}#war .whead p{font-size:13px;line-height:1.55;margin:2px 0 4px;max-width:95ch}
#war .wbody{display:flex;gap:14px;flex:1;min-height:0;flex-wrap:wrap}
#warCv{flex:1 1 560px;min-width:320px;max-width:100%;aspect-ratio:960/560;align-self:flex-start;border:0;background:transparent;cursor:pointer}
#warSide{flex:0 1 320px;min-width:260px;display:flex;flex-direction:column;gap:6px;font-size:13px}
#warSide .iron{display:flex;gap:10px;align-items:center}#warSide .iron img{width:58px;height:46px;object-fit:contain}#warSide .iron b{font-size:22px}
#warSide .wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}#warSide .wgrid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}#warSide .wgrid.g2{grid-template-columns:minmax(0,1fr)}
#warSide .wgrid button{min-width:0}#warSide .wgrid.g3 button{gap:3px;padding:4px 4px}#warSide .wgrid.g3 img{width:22px;height:22px}#warSide .wgrid span{min-width:0;overflow-wrap:anywhere;white-space:normal}#warSide .wgrid em{flex:none;padding-right:4px}
#warSide{min-width:0!important;padding-right:6px}#war .wbody{min-width:0}
#warSide .wgrid button{display:flex;align-items:center;gap:5px;padding:4px 6px;border:2px solid var(--paper-2);background:#fbf6ea;font:inherit;text-align:left;cursor:pointer;position:relative}
#warSide .wgrid button.on{border-color:var(--ember);background:#fff1e3}#warSide .wgrid button:disabled{opacity:.4;cursor:default}
#warSide .wgrid img{width:30px;height:30px;object-fit:contain}#warSide .wgrid img.sm{width:20px;height:20px;margin-left:-8px}
#warSide .wgrid span{flex:1;line-height:1.2}#warSide .wgrid small{display:block;font-size:11px;opacity:.7}
#warSide .wgrid em{font-style:normal;font-weight:700;color:#7a5a2a}#warSide .wgrid em::before{content:"⬩"}
#warSide .hint{font-size:12px;line-height:1.55;opacity:.8;border-top:1px dashed var(--paper-2);padding-top:6px}
#warSide .wgo button{display:flex;align-items:center;gap:6px;padding:6px 10px;font:inherit;font-weight:700}#warSide .wgo img{width:30px;height:24px;object-fit:contain}
#warSide .wgo .hotbtn img{filter:invert(1)}
#warSide .wmsg{min-height:20px;font-size:12.5px}#warSide .wmsg img{width:26px;height:20px;object-fit:contain;vertical-align:middle;margin-right:4px}
#warSide .wlog div{display:flex;gap:6px;align-items:center;padding:3px 0;border-top:1px dashed var(--paper-2)}#warSide .wlog img{width:28px;height:28px;object-fit:contain}
#warSide .wend .zh{font-size:20px;font-weight:900;margin-bottom:6px}#warSide .wseq{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0}
#warSide .wseq div{display:flex;flex-direction:column;align-items:center;gap:4px;animation:wpop .6s calc(var(--i)*.4s) both}
#warSide .gw{display:block;filter:drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 2px var(--glow));animation:wglow 2.4s ease-in-out infinite}
#warSide .gm{display:block;width:70px;height:62px;background:linear-gradient(120deg,var(--c1),var(--c2) 45%,var(--c3) 55%,var(--c1));background-size:250% 100%;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;animation:wshine 3s linear infinite}
#warSide .wseq.win{--c1:#d9542b;--c2:#f2b33d;--c3:#fff0b0;--glow:rgba(255,180,80,.75)}
#warSide .wseq.lose{--c1:#3a4a72;--c2:#6f84b3;--c3:#b9c6e6;--glow:rgba(110,140,200,.55)}
#warSide .wseq.peace{--c1:#1f7a5c;--c2:#4fb08a;--c3:#c9f0dc;--glow:rgba(110,210,160,.6)}
@keyframes wshine{from{background-position:100% 0}to{background-position:-150% 0}}
@keyframes wglow{50%{filter:drop-shadow(0 0 12px var(--glow)) drop-shadow(0 0 3px var(--glow))}}
@keyframes wpop{from{opacity:0;transform:translateY(10px) scale(.7)}60%{transform:scale(1.12)}to{opacity:1;transform:none}}
#music{position:fixed;inset:12px;display:none;flex-direction:column;gap:8px;padding:16px 20px;z-index:12;overflow:auto;border-radius:6px;
  background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.55),rgba(255,255,255,0) 40%),radial-gradient(circle at 80% 90%,rgba(214,186,140,.25),rgba(214,186,140,0) 50%),#f4ead2;box-shadow:0 14px 50px rgba(40,30,15,.28)}
#music::before{content:"";position:absolute;inset:7px;border:2.5px solid rgba(110,80,45,.7);border-radius:14px 6px 18px 8px/8px 16px 6px 14px;pointer-events:none;filter:url(#rough)}
#music>.close{position:absolute;right:16px;top:14px;width:36px;height:36px;font-size:20px}
#music .whead .zh{font-size:26px;font-weight:900}
#music .mbtn,#music .lib,#music .mc{filter:url(#rough)}
#music .mbtn{font:inherit;font-weight:700;font-size:13px;padding:6px 12px;background:rgba(255,252,240,.8);color:var(--ink);border:2px solid rgba(70,50,30,.8);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#music .mbtn:hover{background:#fff6e2;transform:rotate(-.6deg)}#music .mbtn.hot{background:#d9784a;color:#fffaf0;border-color:#8a3a1e}#music .mbtn:disabled{opacity:.45}
#music .mbtn img{width:24px;height:20px;object-fit:contain}
#music .mwrap{display:flex;gap:18px;min-height:0;flex-wrap:wrap}
#music .mlib{flex:0 0 220px;display:flex;flex-direction:column;gap:6px;font-size:13px}
#music .mlib h4{margin:0;font-size:16px}
#music .lib{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;text-align:left;font:inherit;padding:7px 10px;background:rgba(255,252,240,.65);border:1.8px solid rgba(90,65,35,.55);border-radius:12px 4px 14px 5px/5px 12px 4px 14px;cursor:pointer;color:var(--ink)}
#music div.lib{padding:0 4px 0 0}#music div.lib>button{flex:1;display:flex;justify-content:space-between;align-items:center;background:none;border:0;font:inherit;padding:7px 10px;cursor:pointer;text-align:left;color:inherit}
#music .lib small{opacity:.55}#music .lib.sel{background:#fbe1c8;border-color:#b5562a}
#music .lib .del{background:none;border:0;font-size:16px;cursor:pointer;opacity:.5;padding:2px 6px}#music .lib .del:hover{opacity:1}
#music .mylist{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;padding:2px}
#music .mlib .empty{font-size:12px;opacity:.65;margin:2px 0}
#music .libact{display:flex;flex-direction:column;gap:6px;margin-top:4px}
#music .med{flex:1;min-width:300px;display:flex;flex-direction:column;gap:8px}
#music .mctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
#music .mname{font:700 16px var(--body);padding:5px 10px;width:12em;background:transparent;border:0;border-bottom:2px solid rgba(90,65,35,.6);filter:url(#rough);color:var(--ink)}
#music .tempo input{vertical-align:middle;accent-color:#b5562a}
#music .mmsg{font-size:12px;opacity:.7}
#music .mgrid{display:flex;gap:6px;overflow-x:auto;padding:6px 2px}
#music .mheads{display:flex;flex-direction:column;gap:5px;flex:none}
#music .mhead{height:50px;display:flex;align-items:center;gap:8px;font-size:13px;padding-right:6px;min-width:128px}
#music .mhead .gm{width:52px;height:42px;flex:none;background:var(--c);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
#music .mhead.hit .gm{animation:mhit .35s ease-out}
@keyframes mhit{0%{transform:scale(1.35) rotate(-6deg)}100%{transform:none}}
#music .mcols{display:flex;gap:3px;position:relative}
#music .mcol{display:flex;flex-direction:column;gap:5px;padding:0 2px;border-radius:12px 5px 14px 6px}#music .mcol.beat{margin-left:7px}
#music .mcol.now{background:rgba(217,120,74,.2);box-shadow:0 0 0 2px rgba(217,120,74,.25)}
#music .mc{width:clamp(30px,3.4vw,46px);height:50px;padding:0;cursor:pointer;font:700 16px var(--body);color:#fffaf0;
  background:transparent;border:1.6px solid rgba(100,75,45,.42);border-radius:calc(6px + var(--r)*2px) calc(12px - var(--r)*1px) calc(8px + var(--r)*1px) calc(5px + var(--r)*2px)}
#music .mc:hover{background:rgba(255,250,235,.8)}

.frame{border:0!important;border-radius:4px;box-shadow:0 6px 18px rgba(40,30,15,.13)!important;background:var(--pa) 0 0/100% 100% no-repeat,var(--sketch-paper)!important}
#pose.frame{background-image:var(--pb)!important}#prompt.frame{background-image:var(--pc)!important}#notes.frame{background-image:var(--pb)!important}
#topbtns button{border:0;box-shadow:none;background:var(--pc) 0 0/100% 100% no-repeat,#9fb59a;color:#22201c;padding:9px 14px;border-radius:3px}
#topbtns button:nth-child(2n){background-image:var(--pd)}#topbtns button:nth-child(3n){background-image:var(--pa)}
#topbtns button.hot{background:var(--pe) 0 0/100% 100% no-repeat,#e08a5e;color:#fffaf0}
#topbtns button:hover{transform:rotate(-.8deg)}#topbtns button:active{transform:translate(1px,1px);box-shadow:none}
#prompt b{border:0;background:var(--pe) 0 0/100% 100% no-repeat,#e08a5e;padding:2px 7px}
#controls b{background:var(--pd) 0 0/100% 100% no-repeat,rgba(245,236,214,.92);color:#2a2622;padding:0 5px;border-radius:2px}
#pose img{border:0;background:var(--pd) 0 0/100% 100% no-repeat,#efe4c8}

<script>

(()=>{
// ================= math & helpers =================

function mul(a,b){const o=new Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s}return o}

function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

  tree:SCENE_PAPER,shrub:SCENE_PAPER,flower:SCENE_PAPER,crop:SCENE_PAPER,house:SCENE_PAPER,village:SCENE_PAPER,tower:SCENE_PAPER,door:SCENE_PAPER,granary:SCENE_PAPER,stone:SCENE_PAPER,mountain:SCENE_PAPER,slope:SCENE_PAPER,bamboo:SCENE_PAPER,path:SCENE_PAPER,bridge:SCENE_PAPER,grass:SCENE_PAPER,paddy:SCENE_PAPER,sacred_tree:SCENE_PAPER};

const gl=cv.getContext('webgl2',{antialias:true,alpha:true,premultipliedAlpha:false});

const VS=`#version 300 es
in vec3 p;in vec2 uv;in vec3 paper;in vec3 ink;in float alpha;in float haze;
uniform mat4 vp;
out vec2 vuv;out vec3 vp_;out vec3 vi;out float va;out float vh;out vec2 vw;
void main(){gl_Position=vp*vec4(p,1.);vuv=uv;vp_=paper;vi=ink;va=alpha;vh=haze;vw=p.xz;}`;
const FS=`#version 300 es
precision mediump float;
uniform sampler2D tex;uniform int mode;uniform vec3 fogc;uniform vec2 fog;uniform vec3 cam;uniform vec3 lit;uniform vec2 foc;
in vec2 vuv;in vec3 vp_;in vec3 vi;in float va;in float vh;in vec2 vw;out vec4 o;
void main(){vec4 c=texture(tex,vuv);vec3 col;
 if(mode==3){col=c.rgb*vp_;}else{vec3 pc=mix(vp_,vp_*vec3(.8,.74,.64),c.b);col=mix(pc,vi,c.r);}
 float a=c.a*va;
 if(mode==0&&a<.5)discard;

 if(vh>.0005&&vh<.002){float k=smoothstep(12.,34.,length(vw-foc))*smoothstep(25.,33.,length(vw))*.82;float l=dot(col,vec3(.3,.55,.15));col=mix(col,vec3(l*1.02,l*1.02,l*.97),k);
   float kf=k*smoothstep(28.,60.,length(vw-foc));col=mix(col,fogc,kf*.45);
   if(mode==0){ivec2 q=ivec2(mod(gl_FragCoord.xy,4.));const float B[16]=float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);if((B[q.x+q.y*4]+.5)/16.<kf*.62)discard;}}
 if(vh>-1.5&&mode!=2)col*=lit;
 col=mix(col,fogc,f);
 o=vec4(col,(mode==0||mode==3)?1.:a);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}

const U={};for(const n of['vp','cam','tex','mode','fogc','fog','lit','foc'])U[n]=gl.getUniformLocation(prog,n);
const FL=13,MAXQ=16000;
const vbo=gl.createBuffer(),ibo=gl.createBuffer(),vao=gl.createVertexArray();
gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,vbo);

{const idx=new Uint32Array(MAXQ*6);for(let i=0;i<MAXQ;i++){const b=i*4;idx.set([b,b+1,b+2,b,b+2,b+3],i*6)}gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW)}
gl.bufferData(gl.ARRAY_BUFFER,MAXQ*4*FL*4,gl.DYNAMIC_DRAW);
class Batch{constructor(n){this.f=new Float32Array(n*4*FL);this.n=0;this.cap=n}
  reset(){this.n=0}

function updEnc(dt){for(const e of [...encounters]){e.t+=dt;const f=encFrame(e);e.frame=f;
    const pl=e.b.isPlayer;
    if(pl&&player.locked&&MOVEKEY()){endEnc(e);continue}
    if(e.type==='companions'){
      const lead=pl?player:e.a,fol=pl?e.a:e.b;
      if(!pl){if(stepTo(e.a,e.dest[0],e.dest[1],2.4,dt,.5))e.t=Math.max(e.t,e.dur)}
      const ox=Math.cos(cam.yaw)*1.3,oz=-Math.sin(cam.yaw)*1.3;stepTo(fol,lead.x+ox,lead.z+oz,pl?(RUN()?9:5.2):2.4,dt,.25);
    } else if(e.type==='hand'){
      const lead=pl?player:e.a,fol=pl?e.a:e.b;
      if(!pl){if(stepTo(e.a,e.dest[0],e.dest[1],2,dt,.5))e.t=Math.max(e.t,e.dur)}
      const hx=lead.x+Math.cos(cam.yaw)*.75,hz=lead.z-Math.sin(cam.yaw)*.75;if(Math.hypot(hx-fol.x,hz-fol.z)>.08)stepTo(fol,hx,hz,pl?(RUN()?9:5.2):2.2,dt,.05);fol.yawFix=null;
    } else if(e.type==='race'){
      if(e.t<e.go){e.a.pose='look';if(!e.b.isPlayer)e.b.pose='look';continue}
      if(!e.done){const D=e.dest;let fin=null;
        if(!e.a.isPlayer&&stepTo(e.a,D[0],D[1],e.spA,dt,.6))fin=fin||'a';
        if(e.b.isPlayer){if(Math.hypot(player.x-D[0],player.z-D[1])<1.6)fin=fin||'b'}else if(stepTo(e.b,D[0],D[1],e.spB,dt,.6))fin=fin||'b';
        if(e.a.isPlayer===false&&e.a.moving)e.a.speed=e.spA;if(!e.b.isPlayer&&e.b.moving)e.b.speed=e.spB;
        if(fin){e.done=true;e.win=fin;e.t=Math.max(e.t,e.dur-3.2);if(e.b.isPlayer)logLine(W.enc.race,fin==='b'?'赛跑你赢了！ · You won the race!':'赛跑输了 · You lost the race')}
        if(rnd()<dt*6)emit({spr:'_glow',x:D[0],y:Hs(D[0],D[1])+.3,z:D[1],size:3.2,col:[1,.75,.35],alpha:.7,max:1,mode:2})}
      e.a.pose=f.pa;if(!e.b.isPlayer)e.b.pose=f.pb;
    } else {
      for(const [c,p] of [[e.a,e.pa],[e.b,e.pb]]){if(c.isPlayer)continue;const dx=p[0]-c.x,dz=p[1]-c.z;if(Math.hypot(dx,dz)>.05&&!blocked(c.x+dx*dt*4,c.z+dz*dt*4)){c.x+=dx*Math.min(1,dt*4);c.z+=dz*Math.min(1,dt*4)}}
      e.a.pose=f.pa;e.b.pose=e.b.isPlayer?f.pb:f.pb;e.a.shake=f.sa;e.b.shake=f.sb;if(e.type==='lift'){const k=f.lift||0;e.b.lift=1.25*(k*k*(3-2*k));if(e.b.isPlayer){player.x+=(e.pb[0]-player.x)*Math.min(1,dt*4);player.z+=(e.pb[1]-player.z)*Math.min(1,dt*4)}}}
    if(e.type==='gift'&&e.t>2.2&&!e.given){e.given=1;if(e.b.isPlayer){const it=makeItem(e.gift,player.x,player.z);if(player.held)dropItem(player);pickUp(player,it);logLine(e.gift,`${NZ(e.a)} 送了你 ${info(e.gift).zh} · ${NE(e.a)} gave you the ${info(e.gift).en}`)}}
    if(e.t>=e.dur)endEnc(e)}}

// ================= bonfire circle dance (打跳) =================
const dance={on:false,phase:'',t:0,ring:[],off:0,next:60,bpm:104};
function startDance(){if(dance.on)return;dance.on=true;dance.phase='gather';dance.t=0;dance.ring=[];dance.off=0;
  for(const v of villagers)if(v.state!=='encounter'&&v.state!=='feast')joinDance(v);logLine(W.enc.circle,'篝火打跳开始了，大家围过来 · The bonfire dance begins')}
function joinDance(c){if(dance.ring.includes(c))return;if(c.isPlayer&&c.riding)dismount();if(c.isPlayer&&c.enc)endEnc(c.enc);dance.ring.push(c);c.pose=null;
  if(c.isPlayer){player.locked=true;player.sit=false;player.inDance=true}else{c.state='dance';c.act='dance';c.queue=null}}
function leaveDance(c){const i=dance.ring.indexOf(c);if(i>=0)dance.ring.splice(i,1);if(c.isPlayer){player.locked=false;player.inDance=false;player.pose=null}}
function endDance(){for(const c of [...dance.ring]){leaveDance(c);if(!c.isPlayer){c.needs.fun=0;c.needs.social*=.4;c.pose=null;c.state='walk';c.target=randomSpot(c.x,c.z,14,9);c.after=null;c.act='wander';c.st=0;c.chk={x:c.x,z:c.z,t:0};c.cd=rr(6,12)}}
  dance.on=false;dance.next=time+rr(160,220);logLine(W.act.dance,'打跳结束，大家散开 · The dance is over')}
function ringPos(i){const a=i/dance.ring.length*Math.PI*2+dance.off;return[Math.cos(a)*RING_R,Math.sin(a)*RING_R]}
let beatPh=0,beatN=0;
function updDance(dt){const spb=60/dance.bpm;beatPh+=dt/spb;if(beatPh>=1){beatPh-=1;beatN++;if(dance.on&&dance.phase==='dance')for(const c of dance.ring)emit({spr:'_blob',x:c.x,y:.15,z:c.z,vx:rr(-.3,.3),vy:.3,size:.45,grow:.6,col:[.86,.78,.6],alpha:.5,max:.8})}
  if(!dance.on){if(time>dance.next)startDance();return}
  dance.t+=dt;
  for(const v of villagers)if(!dance.ring.includes(v)&&v.state!=='encounter'&&v.state!=='feast'&&dance.phase!=='end')joinDance(v);
  if(player.inDance&&MOVEKEY())leaveDance(player);
  if(dance.phase==='gather'){let all=true;dance.ring.forEach((c,i)=>{const [x,z]=ringPos(i);if(c.isPlayer){c.x+=(x-c.x)*Math.min(1,dt*3);c.z+=(z-c.z)*Math.min(1,dt*3);return}if(!stepTo(c,x,z,3.4,dt,.35))all=false});
    if((all&&dance.t>3)||dance.t>11){dance.phase='dance';dance.t=0}}
  else if(dance.phase==='dance'){const bar=beatN%4;dance.off+=dt*(bar<3?.16:.03);
    dance.ring.forEach((c,i)=>{const [x,z]=ringPos(i);c.x+=(x-c.x)*Math.min(1,dt*3);c.z+=(z-c.z)*Math.min(1,dt*3);c.pose='dance'});
    if(dance.t>42)endDance()}}

let fireBoost=0;const HOLD_MAX=60;
const ITEM_INK={'P2759-2-05':'#b8601e','P2760-3-03':'#3f7a3a','P2759-2-02':'#2b78a8','P2761-3-07':'#a0402a','P2759-2-04':'#3d6a9a','P2760-1-09':'#8a7a5a','P2761-1-07':'#8a3a2a','P2760-3-07':'#b0566a','P2761-2-01':'#4f86b8','P2760-1-06':'#c9a227','P2760-1-01':'#5a5a7a','P2788-3-06':'#3f7a3a','P2788-1-02':'#7a8a2a','P2787-3-07':'#9a7a1e','P2790-1-04':'#c9541e','P2788-2-04':'#5f8f2a','P2788-3-03':'#8a4a8a','P2789-2-04':'#a0522d','P2784-3-02':'#8a7a5a','P2788-1-03':'#b08a1e','P2787-1-08':'#c23a5b','P2786-1-02':'#6b3d1c','P2761-1-04':'#8a3a2a','P2759-1-01':'#3d6a9a','P2759-1-02':'#3d6a9a','P2759-3-07':'#4a4a4a','P2755-3-10':'#7a5a2a','P2756-2-05':'#a2412b'};
function itemInk(it){if(it.ink)return personInk(it.ink);if(it.kind==='standee')return personInk(it.inkG||'#6b4423');return personInk(ITEM_INK[it.g]||'#6b4a2a')}
function nearestItem(c,r,uses){let b=null,bd=r;for(const it of items){if(it.held||it.gone||it.onTable||it.inPot)continue;if(uses&&!uses.includes(it.meta.use))continue;const d=Math.hypot(it.x-c.x,it.z-c.z);if(d<bd){bd=d;b=it}}return b}
function pickUp(c,it){if(c.held)dropItem(c);it.held=c;c.held=it;c.heldT=0;if(c.isPlayer){markSeen(it.g);logLine(it.g,`你捡起了 ${info(it.g).zh} · picked up ${info(it.g).en}`)}}
function dropItem(c){const it=c.held;if(!it)return;it.held=null;c.held=null;const yw=cam.yaw;let x=c.x+Math.cos(yw)*.9,z=c.z-Math.sin(yw)*.9;if(blocked(x,z)){x=c.x;z=c.z}it.x=x;it.z=z}
function useUp(it){it.held=null;it.inPot=false;it.onTable=false;if(it.temp)removeItem(it);else{it.gone=true;it.back=time+rr(50,80)}}
function consume(c){const it=c.held;if(!it)return;c.held=null;if(it.kind==='standee'){it.heldBy=null;return}useUp(it)}
function addFuel(c){consume(c);fireBoost=Math.min(40,fireBoost+22)}
function tickItems(dt){for(const it of items)if(it.gone&&time>it.back){it.gone=false;it.x=it.hx;it.z=it.hz}
  fireBoost=Math.max(0,fireBoost-dt);
  if(player.held){player.heldT+=dt;if(player.heldT>HOLD_MAX){if(player.held.kind==='standee')putAnimalDown();else{logLine(player.held.g,`放下了 ${info(player.held.g).zh} · put down the ${info(player.held.g).en}`);dropItem(player)}}}
  for(const v of villagers)if(v.held&&!v.queue){v.heldT+=dt;if(v.heldT>25){if(v.held.temp&&v.held.meta.use==='give'){const it=v.held;v.held=null;removeItem(it)}else dropItem(v)}}}
function nearVillager(r){let v=null,bd=r;for(const c of villagers){const d=Math.hypot(c.x-player.x,c.z-player.z);if(d<bd&&!c.enc&&c.state!=='dance'){bd=d;v=c}}return v}
function useHeld(){const it=player.held;
  if(it.meta.use==='fire'&&Math.hypot(player.x,player.z)<5){addFuel(player);logLine(it.g,'你往篝火里添了柴，火更旺了 · you fed the fire');return}
  const v=nearVillager(3);if(v){giveTo(v,it);return}

function farmSpot(){const p=pick(PLOTS.filter(p=>['rice','wheat','veg'].includes(p[5])));const a=p[4],lx=rr(-p[2]/2+1,p[2]/2-1),lz=p[3]/2+1.2;return[p[0]+lx*Math.cos(a)-lz*Math.sin(a),p[1]+lx*Math.sin(a)+lz*Math.cos(a)]}
function giveTo(v,it){player.held=null;if(v.held)dropItem(v);it.held=v;v.held=it;v.heldT=0;v.pose=null;v.needs.social=0;
  const k=it.meta.kind,u=it.meta.use;logLine(it.g,`你把 ${info(it.g).zh} 给了 ${NZ(v)} · you gave the ${info(it.g).en} to ${NE(v)}`);
  if(k==='food')v.queue=[{t:'pose',pose:u==='drink'?'drink_wine':'eat',dur:5},{t:'consume'}];
  else if(u==='fire')v.queue=[{t:'pose',pose:'laugh',dur:1.2},{t:'go',x:2.6,z:2.4},{t:'fuel'}];
  else if(u==='farm'){const [x,z]=farmSpot();v.queue=[{t:'pose',pose:'laugh',dur:1.2},{t:'go',x,z},{t:'pose',pose:'bend',dur:7},{t:'home'}]}
  else if(u==='music')v.queue=[{t:'pose',pose:'sing',dur:6},{t:'home'}];
  else if(u==='give'){v.queue=[{t:'pose',pose:'laugh',dur:2.2},{t:'pose',pose:'hug',dur:2}];v.needs.social=0;v.needs.fun=Math.max(0,v.needs.fun-.4);v.flowerT=time;logLine(it.g,`${NZ(v)} 收到花很开心 · ${NE(v)} is delighted`)}
  else v.queue=[{t:'pose',pose:'laugh',dur:2},{t:'home'}];
  v.act='given';v.state='queue';v.st=0;v.chk={x:v.x,z:v.z,t:0}}
function abortQueue(v){v.queue=null;if(v.held)dropItem(v);v.pose=null;v.state='idle';v.st=0;v.dur=rr(.5,1.5)}
function runQueue(v,dt){const q=v.queue;if(!q||!q.length){v.queue=null;v.state='idle';v.st=0;v.dur=rr(.5,1.5);v.pose=null;return}
  const s=q[0];
  const stuck=()=>{v.chk.t+=dt;if(v.chk.t>2.2){const bad=Math.hypot(v.x-v.chk.x,v.z-v.chk.z)<.3;v.chk={x:v.x,z:v.z,t:0};if(bad){abortQueue(v);return true}}return false};
  if(s.t==='go'){if(stepTo(v,s.x,s.z,v.spd,dt,.5)){q.shift();v.chk={x:v.x,z:v.z,t:0}}else stuck()}
  else if(s.t==='pick'){const it=s.it;if(it.held||it.gone)return abortQueue(v);if(Math.hypot(it.x-v.x,it.z-v.z)>1.4){if(!stepTo(v,it.x,it.z,v.spd,dt,1.2))stuck()}else{pickUp(v,it);q.shift()}}
  else if(s.t==='pose'){if(!s.on){s.on=true;v.pose=s.pose;s.t0=time}if(time-s.t0>s.dur){v.pose=null;q.shift()}}
  else if(s.t==='consume'){if(v.held&&v.held.meta.kind==='food')v.needs.hunger=0;consume(v);q.shift()}
  else if(s.t==='lantern'){floatLantern(v);if(rnd()<.35)logLine(W.roles.river_lantern[0],`${NZ(v)} 去小溪边放了一盏河灯 · ${NE(v)} set a lantern on the stream`);q.shift()}
  else if(s.t==='fuel'){if(v.held){const g=v.held.g;addFuel(v);logLine(g,`${NZ(v)} 往篝火里添了柴 · ${NE(v)} fed the fire`)}q.shift()}
  else if(s.t==='home'){const it=v.held;if(!it){q.shift();return}if(stepTo(v,it.hx,it.hz,v.spd,dt,.7)){it.held=null;v.held=null;it.x=it.hx;it.z=it.hz;q.shift()}else stuck()}}

function mkKitchen(px,pz,tx,tz,name){const p={kind:'pot',role:'pot',x:px,z:pz,contents:[],cooking:null,pick:true,name},t={kind:'table',role:'table',x:tx,z:tz,dishes:[],pick:true,name};p.table=t;t.pot=p;return{pot:p,table:t,name}}
const KITCHENS=[mkKitchen(16.6,9.8,21.8,10,'east'),mkKitchen(-21.4,8.8,-16.2,9,'west')];
let pot=KITCHENS[0].pot,table=KITCHENS[0].table;
function selectKitchen(){let b=KITCHENS[0],bd=1e9;for(const K of KITCHENS){const d=Math.hypot(K.pot.x-player.x,K.pot.z-player.z)*.5+Math.hypot(K.table.x-player.x,K.table.z-player.z)*.5;if(d<bd){bd=d;b=K}}pot=b.pot;table=b.table}
function putOnTable(t,it){t.dishes.push(it);it.onTable=true;it.tbl=t}
const MAX_DISHES=4,POT_MAX=3;
let recipesSeen=new Set(store.get('dw.recipes',[]));
function itemMeta(g){return W.items.find(i=>i.id===g)||{kind:'food',use:'eat'}}
function makeItem(g,x,z,temp=true){const meta=itemMeta(g);const it={kind:'item',g,x,z,hx:x,hz:z,h:meta.dish?.62:meta.kind==='food'?.6:.8,meta,held:null,gone:false,ph:rnd()*7,role:'item',temp};items.push(it);return it}
function removeItem(it){const i=items.indexOf(it);if(i>=0)items.splice(i,1)}
function recipeFor(ids){const key=[...ids].sort().join('+');const r=W.recipes.find(r=>[...r.in].sort().join('+')===key);return r?{...r,found:true}:{...W.recipe_fallback,in:ids,found:false}}
function startCooking(){if(!pot.contents.length||pot.cooking)return;const r=recipeFor(pot.contents.map(i=>i.g));pot.cooking={r,t:0,dur:4.5,ins:pot.contents.map(i=>i.g)};
  for(const it of pot.contents)useUp(it);pot.contents=[];logLine(r.act,`锅里开始${info(r.act).zh}了 · the pot is cooking`)}

    if(rnd()<dt*8&&!reduceMotion)emit({spr:'_blob',x:pot.x+rr(-.3,.3),y:Hs(pot.x,pot.z)+1.8,z:pot.z,vx:rr(-.1,.2),vy:rr(.6,1),size:.4,grow:.5,col:[.95,.95,.95],alpha:.5,max:2.2});

function nearestCart(r){let b=null,bd=r;for(const o of objs){if(!o.cart||o.ridden)continue;const d=Math.hypot(o.x-player.x,o.z-player.z);if(d<bd){bd=d;b=o}}return b}
function boardCart(o){if(player.held)dropItem(player);player.riding=o;o.ridden=true;player.sit=false;markSeen(o.g);markSeen(W.act.cart);logLine(W.act.cart,'你坐上了车 · you got on the cart')}
function nearestAnimal(r){let b=null,bd=r;for(const o of objs){if(o.role!=='animal'||!o.wander||o.heldBy||o.ridden)continue;if(!animalAct(o))continue;const d=Math.hypot(o.x-player.x,o.z-player.z);if(d<bd){bd=d;b=o}}return b}
function useAnimal(o){const a=animalAct(o);markSeen(o.g);markSeen(a.act);

function hud(dt){
  let best=null,bd=4.2;
  for(const v of villagers){const d=Math.hypot(v.x-player.x,v.z-player.z);if(d<3.2&&d<bd){bd=d;best=v}}
  if(!best)for(const o of objs){if(!o.pick||o.part||o.sky||o.far||o.x===undefined||o.role==='bird')continue;const d=Math.hypot(o.x-player.x,o.z-player.z);if(d<bd){bd=d;best=o}}
  near=best;
  let key='',html='';const act=interaction();
  if(player.inDance){key='indance';html=(TOUCH?T('推摇杆','Stick: '):'<b>WASD</b>')+T('离开打跳','Leave the dance')}
  else if(player.enc&&player.enc.type==='race'){const e=player.enc;const left=Math.ceil(e.go-e.t);key='race'+left+(e.done?e.win:'')+LANG;
    html=e.done?(e.win==='b'?T('你赢了！','You won!'):T('TA 先到了','They got there first')):left>0?T(`赛跑！跑到红旗那里 · ${left}`,`Race to the red flag · ${left}`):(TOUCH?T('跑！摇杆推到底冲刺，先到红旗的赢','Go! Push the stick all the way to sprint; first to the red flag wins'):T('跑！按住 Shift 冲刺，先到红旗的赢','Go! Hold Shift to sprint; first to the red flag wins'))}
  else if(player.enc&&player.locked){key='enc';html=(TOUCH?T('推摇杆','Stick: '):'<b>WASD</b>')+T('走开','walk away')}
  else if(player.act){key='acting'+LANG;html=esc(player.act.text)+'…'}
  else if(act){key=act.key+LANG+(player.held?'g':'')+TOUCH;html=`<b>${KF()}</b>${esc(act.text)}`+(player.held&&!TOUCH&&!act.key.startsWith('drop')?' · <b>G</b>'+T('放下','Drop'):'')}
  else if(player.held){const it=player.held,v=nearVillager(3);
    if(it.meta.use==='fire'&&Math.hypot(player.x,player.z)<5){key='fuel';html='<b>'+KF()+'</b>'+T('添柴','Feed the fire')}
    else if(v){key='give'+v.id;html='<b>'+KF()+'</b>'+esc(T(`给 ${v.name}`,`Give it to ${v.name}`))}
    else{key='drop';html='<b>'+KF()+'</b>'+esc(T(`放下 ${info(it.g).zh}`,`Put down the ${info(it.g).en}`))}}
  else if(nearestItem(player,2)){const it=nearestItem(player,2);key='pick'+it.g+it.x;html='<b>'+KF()+'</b>'+esc(T(`捡起 ${info(it.g).zh}`,`Pick up the ${info(it.g).en}`))}
  else if(best){key='n'+(best.name||best.g)+best.x;html='<b>'+KF()+'</b>'+esc(T(`看看 ${label(best)}`,`Look at ${label(best)}`))}
  if(TOUCH){const hd=!!(player.held&&!player.act);if(hd!==tbtnsEl.classList.contains('held'))tbtnsEl.classList.toggle('held',hd);const so=!!player.sit;if(so!==tbSitEl.classList.contains('on'))tbSitEl.classList.toggle('on',so)}
  if(TOUCH){const uo=notesEl.style.display==='block'||[dressEl,starEl,warEl,musEl,studyEl].some(m=>m.style.display==='flex')||!!document.querySelector('#recipes[style*="block"],#photoView[style*="flex"]');if(uo!==document.body.classList.contains('uiopen'))document.body.classList.toggle('uiopen',uo)}
  if(key&&TOUCH)key+='t';
  if(key!==promptKey){promptKey=key;promptEl.innerHTML=html;promptEl.style.display=key?'block':'none'}
  if(dance.on){const ph=dance.phase==='gather'?T('大家围过来','gathering'):T('跳舞中','dancing');const pr=dance.phase==='gather'?0:dance.t/42;
    bannerEl.innerHTML=`<img src="glyphs/${dance.phase==='gather'?W.enc.circle:W.enc.circle_facing}.png" alt=""><div><b>${T('篝火打跳','Bonfire dance')}</b> · ${ph} · ${T(dance.ring.length+' 人',dance.ring.length+' people')}</div><div class="bar"><i style="width:${Math.round(pr*100)}%"></i></div>`;bannerEl.style.display='flex'}
  else bannerEl.style.display='none';
  const pg=charPoseGlyph(player);const ptxt=player.moving&&!player.pose?(player.speed>5?T('跑','Running'):T('走','Walking')):null;const pk=pg+(ptxt||'')+LANG;
  if(pk!==lastPose){lastPose=pk;const i=info(pg);document.getElementById('poseImg').src=`glyphs/${pg}.png`;document.getElementById('poseZh').textContent=ptxt||(player.pose==='jump'?T('跳','jump'):player.pose==='sit'?T('坐','sit'):player.pose==='hug'?T('抱','hold in the arms'):GN(pg));
    document.getElementById('poseEn').textContent='';document.getElementById('poseId').textContent=pg}
  const hk=player.held?player.held.g+Math.ceil(HOLD_MAX-player.heldT)+LANG:'';if(hk!==lastHeld){lastHeld=hk;heldEl.innerHTML=player.held?`<img src="glyphs/${player.held.g}.png" alt="">${esc(T('拿着 '+info(player.held.g).zh,'Holding the '+info(player.held.g).en))} · ${Math.ceil(HOLD_MAX-player.heldT)}s`:''}
  if(MUS.playing&&!reduceMotion&&rnd()<dt*5){const S=STATIONS.music;emit({spr:'_dot',x:S.x+rr(-.8,.8),y:Hs(S.x,S.z)+rr(1.6,2.8),z:S.z+rr(-.5,.5),vx:rr(-.3,.3),vy:rr(.5,.9),fl:1,seed:rnd()*9,size:.24,col:pick([[.95,.55,.2],[.48,.25,.63],[.18,.54,.42],[.17,.47,.66]]),alpha:1,max:2.4,mode:2})}
  if(cardAuto&&cardEl.style.display==='block'){if(cardEl.matches(':hover'))cardPoke();else if(performance.now()-cardIdle>3000){closeCard();cv.focus()}}
  cardTimer+=dt;if(cardTimer>.5){cardTimer=0;if(selected&&selected.base&&!selected.isPlayer&&cardEl.style.display==='block'&&!cardEl.matches(':hover'))cardEl.innerHTML=villagerCard(selected)}
}
